server:
  port: 8071

encrypt:
  key: VUS41R73L5JQOGTLUSMWT16SHS06ODQQNLM7WQPU

spring:
  application:
    name: configurations-server

  profiles:
    active: git

  cloud:
    config:
      server:
        git:
          uri: https://github.com/Askie01/microservices-tutorial-config.git
          timeout: 5
          clone-on-start: true
          force-pull: true
        default-label: master

management:
  endpoint:
    health:
      probes:
        enabled: true

  endpoints:
    web:
      exposure:
        include: "*"

  health:
    liveness-state:
      enabled: true

    readiness-state:
      enabled: true

logging:
  file:
    name: configuration-server/src/main/java/com/askie01/configuration-server/logs/configuration-server-microservice.log