server:
  port: 8080

spring:
  application:
    name: accounts

  profiles:
    active: development

  config:
    import: optional:configserver:http://localhost:8071/

  datasource:
    url: jdbc:mysql://localhost:3306/accounts-database
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: none

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

management:
  info:
    env:
      enabled: true

  endpoint:
    shutdown:
      access: unrestricted

  endpoints:
    web:
      exposure:
        include: "*"

eureka:
  instance:
    prefer-ip-address: true

  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8070/eureka/

resilience4j:
  circuitbreaker:
    instances:
      cards-api-client-circuit-breaker:
        base-config: default

      loans-api-client-circuit-breaker:
        base-config: default

    configs:
      default:
        sliding-window-size: 10
        permittedNumberOfCallsInHalfOpenState: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

  timelimiter:
    instances:
      cards-api-client-time-limiter:
        base-config: default

      loans-api-client-time-limiter:
        base-config: default

    configs:
      default:
        timeout-duration: 1s
        cancel-running-future: true

  retry:
    instances:
      cards-api-client-retry:
        base-config: default

      loans-api-client-retry:
        base-config: default

    configs:
      default:
        max-attempts: 5
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.util.concurrent.TimeoutException

info:
  application:
    name: accounts-microservice
    description: Askie01's accounts microservice
    version: 1.0.0