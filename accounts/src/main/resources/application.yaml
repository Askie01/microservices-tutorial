server:
  port: 8080

spring:
  application:
    name: accounts

  profiles:
    active: development

  config:
    import: optional:configserver:http://localhost:8071/

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:embedded-database
    username: root
    password: root

  h2:
    console:
      enabled: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

management:
  endpoints:
    web:
      exposure:
        include: "*"