services:

  accounts:
    image: "askie01/accounts:latest"
    container_name: "accounts-microservice"
    ports:
      - "8080:8080"
    environment:
      - "spring.profiles.active=quality-assurance"
      - "spring.datasource.url=jdbc:mysql://accounts-database:3306/accounts-database"
    extends:
      file: microservice-configuration.yaml
      service: accounts-microservice-configuration
    tty: true
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 5

  accounts-database:
    image: "mysql:latest"
    container_name: "accounts-database"
    ports:
      - "3306:3306"
    volumes:
      - "../sql/accounts/schema:/docker-entrypoint-initdb.d"
      - "../sql/accounts/data/quality-assurance:/var/lib/mysql"
    environment:
      - "MYSQL_ROOT_PASSWORD=root"
      - "MYSQL_DATABASE=accounts-database"
    extends:
      file: microservice-configuration.yaml
      service: network-configuration
    tty: true
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 5

  loans:
    image: "askie01/loans:latest"
    container_name: "loans-microservice"
    ports:
      - "8090:8090"
    environment:
      - "spring.profiles.active=quality-assurance"
      - "spring.datasource.url=jdbc:mysql://loans-database:3306/loans-database"
    extends:
      file: microservice-configuration.yaml
      service: loans-microservice-configuration
    tty: true
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8090/actuator/health" ]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 5

  loans-database:
    image: "mysql:latest"
    container_name: "loans-database"
    ports:
      - "3307:3306"
    volumes:
      - "../sql/loans/schema:/docker-entrypoint-initdb.d"
      - "../sql/loans/data/quality-assurance:/var/lib/mysql"
    environment:
      - "MYSQL_ROOT_PASSWORD=root"
      - "MYSQL_DATABASE=loans-database"
    extends:
      file: microservice-configuration.yaml
      service: network-configuration
    tty: true
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 5

  cards:
    image: "askie01/cards:latest"
    container_name: "cards-microservice"
    ports:
      - "9000:9000"
    environment:
      - "spring.profiles.active=quality-assurance"
      - "spring.datasource.url=jdbc:mysql://cards-database:3306/cards-database"
    extends:
      file: microservice-configuration.yaml
      service: cards-microservice-configuration
    depends_on:
      cards-database:
        condition: service_healthy
    tty: true
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/actuator/health" ]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 5

  cards-database:
    image: "mysql:latest"
    container_name: "cards-database"
    ports:
      - "3308:3306"
    volumes:
      - "../sql/cards/schema:/docker-entrypoint-initdb.d"
      - "../sql/cards/data/quality-assurance:/var/lib/mysql"
    environment:
      - "MYSQL_ROOT_PASSWORD=root"
      - "MYSQL_DATABASE=cards-database"
    extends:
      file: microservice-configuration.yaml
      service: network-configuration
    tty: true
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 5

  configuration-server:
    image: "askie01/configuration-server:latest"
    container_name: "configuration-server-microservice"
    ports:
      - "8071:8071"
    extends:
      file: microservice-configuration.yaml
      service: common-microservice-configuration
    tty: true
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8071/actuator/health" ]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: "rabbitmq:4-management"
    container_name: "rabbitmq"
    ports:
      - "5672:5672"
      - "15672:15672"
    tty: true
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_port_connectivity" ]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5
    extends:
      file: microservice-configuration.yaml
      service: network-configuration

networks:
  microservices-network:
    driver: "bridge"