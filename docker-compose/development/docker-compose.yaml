services:

  accounts:
    image: "askie01/accounts:latest"
    container_name: "accounts-microservice"
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - "microservices-tutorial"
    environment:
      - "SPRING_PROFILES_ACTIVE=development"
      - "SPRING_CONFIG_IMPORT=configserver:http://configuration-server:8071"

  loans:
    image: "askie01/loans:latest"
    container_name: "loans-microservice"
    ports:
      - "8090:8090"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - "microservices-tutorial"
    environment:
      - "SPRING_PROFILES_ACTIVE=development"
      - "SPRING_CONFIG_IMPORT=configserver:http://configuration-server:8071"

  cards:
    image: "askie01/cards:latest"
    container_name: "cards-microservice"
    ports:
      - "9000:9000"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - "microservices-tutorial"
    environment:
      - "SPRING_PROFILES_ACTIVE=development"
      - "SPRING_CONFIG_IMPORT=configserver:http://configuration-server:8071"

  configuration-server:
    image: "askie01/configuration-server:latest"
    container_name: "configuration-server-microservice"
    ports:
      - "8071:8071"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - "microservices-tutorial"

  rabbitmq:
    image: "rabbitmq:4-management"
    container_name: "rabbitmq"
    ports:
      - "5672:5672"
      - "15672:15672"
    stdin_open: true
    tty: true
    restart: "no"
    networks:
      - "microservices-tutorial"

networks:
  microservices-tutorial:
    driver: "bridge"