services:

  accounts-microservice-configuration:
    extends:
      file: microservice-configuration.yaml
      service: microservice-configuration

    ports:
      - "${accounts_microservice_exposed_port}:${accounts_microservice_port}"

    environment:
      - "server.port=${accounts_microservice_port}"
      - "spring.profiles.active=${accounts_microservice_active_profiles}"
      - "spring.config.import=configserver:http://configuration-server:${configuration_server_microservice_port}"
      - "spring.datasource.url=jdbc:mysql://accounts-database:3306/accounts"
      - "spring.datasource.username=${accounts_database_username}"
      - "spring.datasource.password=${accounts_database_password}"
      - "eureka.client.service-url.defaultZone=http://discovery-server:${discovery_server_microservice_port}/eureka/"
      - "spring.rabbitmq.host=rabbitmq"

    depends_on:
      rabbitmq:
        condition: service_healthy

      configuration-server:
        condition: service_healthy

      accounts-database:
        condition: service_healthy

      discovery-server:
        condition: service_healthy