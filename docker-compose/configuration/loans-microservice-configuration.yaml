services:

  loans-microservice-configuration:
    extends:
      file: microservice-configuration.yaml
      service: microservice-configuration

    ports:
      - "${loans_microservice_port}:8090"

    environment:
      - "spring.profiles.active=${loans_microservice_active_profiles}"
      - "spring.config.import=configserver:http://configuration-server:${configuration_server_microservice_port}"
      - "spring.datasource.url=jdbc:mysql://loans-database:3306/loans"
      - "spring.datasource.username=${loans_database_username}"
      - "spring.datasource.password=${loans_database_password}"
      - "eureka.client.service-url.defaultZone=http://discovery-server:${discovery_server_microservice_port}/eureka/"
      - "spring.rabbitmq.host=rabbitmq"

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8090/actuator/health" ]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 5

    depends_on:
      rabbitmq:
        condition: service_healthy

      configuration-server:
        condition: service_healthy

      loans-database:
        condition: service_healthy

      discovery-server:
        condition: service_healthy