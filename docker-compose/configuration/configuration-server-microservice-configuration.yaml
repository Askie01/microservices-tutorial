services:

  configuration-server-microservice-configuration:
    extends:
      file: microservice-configuration.yaml
      service: microservice-configuration

    ports:
      - "${configuration_server_microservice_exposed_port}:${configuration_server_microservice_port}"

    environment:
      - "server.port=${configuration_server_microservice_port}"
      - "spring.rabbitmq.host=rabbitmq"

    depends_on:
      rabbitmq:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8071/actuator/health" ]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 5