spring:
  application:
    name: discovery-server

  profiles:
    active: default

  config:
    import: optional:configserver:http://localhost:8071/

management:
  metrics:
    tags:
      application: ${spring.application.name}

  endpoint:
    health:
      probes:
        enabled: true

  endpoints:
    web:
      exposure:
        include: "*"

  health:
    liveness-state:
      enabled: true

    readiness-state:
      enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"