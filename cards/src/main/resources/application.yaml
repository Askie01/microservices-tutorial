server:
  port: 9000

spring:

  application:
    name: cards

  profiles:
    active: development

  config:
    import: configserver:http://localhost:8071/

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:embedded-database
    username: root
    password: root

  h2:
    console:
      enabled: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  file:
    name: cards/src/main/java/com/askie01/cards/logs/cards-microservice.log