server:
  port: 9000

spring:
  application:
    name: cards

  profiles:
    active: development

  config:
    import: optional:configserver:http://localhost:8071/

  datasource:
    url: jdbc:mysql://localhost:3308/cards-database
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: none

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

management:
  info:
    env:
      enabled: true

  endpoint:
    shutdown:
      access: unrestricted

  endpoints:
    web:
      exposure:
        include: "*"

eureka:
  instance:
    prefer-ip-address: true

  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8070/eureka/

info:
  application:
    name: cards-microservice
    description: Askie01's cards microservice
    version: 1.0.0